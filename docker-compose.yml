services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Comes from .env, which is gitignored. See .env.example for the format.
      # Leaving it empty is safe: SQL Server refuses to start on a blank password
      # and says so in the container log.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - zisk-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ZISK;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ZISK_SEED_MODE: ${ZISK_SEED_MODE:-local}

      # Only read when ZISK_SEED_MODE=demo. In local mode the seeded accounts use the
      # built-in development passwords instead (DatabaseInitializer.SeedPasswordSet).
      Seed__Passwords__Admin: ${SEED_ADMIN_PASSWORD:-Admin123!}
      Seed__Passwords__Coach: ${SEED_COACH_PASSWORD:-Coach123!}
      Seed__Passwords__Parent: ${SEED_PARENT_PASSWORD:-Parent123!}
      Seed__Passwords__Child: ${SEED_CHILD_PASSWORD:-Child123!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  zisk-db-data:
