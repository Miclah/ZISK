services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Set MSSQL_SA_PASSWORD in your .env file (see .env.example). If it's left unset,
      # SQL Server's own startup password-complexity check rejects an empty password and
      # the container exits with a clear error - no `${VAR:?msg}` compose operator needed
      # here (that syntax previously tripped a GitGuardian false positive, see below).
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - zisk-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ZISK;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ZISK_SEED_MODE: ${ZISK_SEED_MODE:-local}
    depends_on:
      db:
        condition: service_healthy

volumes:
  zisk-db-data:
