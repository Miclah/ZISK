version: 2

# GitGuardian's "Generic Password" detector misparsed the docker-compose
# `${VAR:?error message}` operator on commit f369ebb - it captured the text
# after ":?" as if it were the literal secret value. That operator has since
# been removed (see docker-compose.yml), but the flagged historical commit
# stays in this branch's history, so this scoped ignore (plus resolving
# incident 35253190 in the GitGuardian dashboard) covers it going forward.
# No literal secret was ever present - only ${VAR} references resolved from
# .env (gitignored) at container-start time.
secret:
  ignored-paths:
    - docker-compose.yml
